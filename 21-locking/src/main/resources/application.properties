spring.application.name=ticketing-locking

spring.sql.init.mode=always

# The schema is ours (schema.sql), not Hibernate's. Validate against it so a
# mapping mistake fails at startup rather than at 3am.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false

# Off, deliberately. Open-session-in-view keeps the persistence context - and on
# some paths the database connection - alive for the whole HTTP response,
# including view rendering. In a lesson about how long you hold things, that is
# not a default to leave on. See the core concepts section of the README.
spring.jpa.open-in-view=false

# Uncomment to watch the SQL Hibernate actually emits - the FOR UPDATE clauses,
# the version predicates in UPDATE statements, and the flush ordering.
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
