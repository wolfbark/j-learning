spring.application.name=expense-api

# The Keycloak realm this service trusts. Everything about token validation starts here: Spring
# fetches the discovery document and the JWKS from this URL and builds a JwtDecoder from it.
# For `docker compose up` this is the local Keycloak; tests override it with the container's port.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/expenses

# Who this API expects to be the audience of a token. Nothing reads this property yet (step 2).
expense.api.audience=expense-api

# The one browser origin that is allowed to call this API. Nothing reads this property yet (step 5).
expense.cors.allowed-origins=https://expenses.example.com

# Hosts a receipt may be pulled from. Nothing reads this property yet (step 6).
expense.receipts.allowed-hosts=receipts.example.com,files.example.com

# Approvals allowed per manager per minute. Nothing reads this property yet (step 7).
expense.approvals.per-minute=5

expense.audit.hmac-key=cf39a1e0b6d84f2a9c7e5b31d0a84f61
expense.legacy.admin-password=Autumn2019!

spring.datasource.url=jdbc:postgresql://localhost:5432/expenses
spring.datasource.username=expenses
spring.datasource.password=expenses

logging.level.audit=INFO
