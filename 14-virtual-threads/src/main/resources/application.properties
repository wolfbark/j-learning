spring.application.name=loom-aggregator

# ---------------------------------------------------------------------------
# Step 2 lives here. One property flips the whole web layer from a bounded
# platform-thread pool to a virtual thread per request:
#
#   spring.threads.virtual.enabled=true
#
# It is deliberately absent. Add it when the lesson tells you to, and note
# that once it is on, server.tomcat.threads.max below stops mattering.
# ---------------------------------------------------------------------------

# A deliberately small pool, so the ceiling is visible without a load generator.
# Production defaults are 200 — which only moves the cliff, it does not remove it.
server.tomcat.threads.max=8

# Simulated latencies. Small enough for fast tests, big enough to dominate.
loom.downstream-delay-ms=150
loom.pool-size=10
loom.query-ms=50

# Correlation id in every log line — step 6 is about keeping it there.
logging.pattern.level=%5p [%X{correlationId:-no-correlation-id}]
management.endpoints.web.exposure.include=health,info,metrics
