spring.application.name=orders-events-outbox

# Domain schema (orders, fulfillment_tasks) — plain SQL, see schema.sql
spring.sql.init.mode=always

# Spring Modulith event publication registry: create the event_publication
# table on startup. This table IS the outbox — SELECT from it in step 3.
spring.modulith.events.jdbc.schema-initialization.enabled=true

# Fulfillment consumer
spring.kafka.consumer.group-id=fulfillment
spring.kafka.consumer.auto-offset-reset=earliest

# Values travel as raw JSON bytes. Object <-> JSON conversion happens in the
# messaging layer (RecordMessageConverter), not in the (de)serializers.
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
