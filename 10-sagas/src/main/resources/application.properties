spring.application.name=trip-booking-saga

# Domain schema — plain SQL, CREATE TABLE IF NOT EXISTS, see schema.sql.
# Data survives restarts on purpose: half-finished sagas should still be
# there when you come back to stare at them.
spring.sql.init.mode=always

# The four topics. Integration tests override these per Spring context so
# that events replayed from an earlier round can't leak into a later one.
trips.topics.events=trips.events
trips.topics.flight-commands=trips.flight.commands
trips.topics.hotel-commands=trips.hotel.commands
trips.topics.payment-commands=trips.payment.commands

# Strings on the wire: the JSON envelope is the contract (TripMessageCodec),
# Boot's default String(De)Serializers carry it.
spring.kafka.consumer.auto-offset-reset=earliest
# Snappier pause/shutdown (checkpoint 5 "crashes" the orchestrator's consumer).
spring.kafka.listener.poll-timeout=1000

# Step 3 is "diagnose from logs and tables only" — keep the logs readable.
logging.level.org.apache.kafka=WARN
