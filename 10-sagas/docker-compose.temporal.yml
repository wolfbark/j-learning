# Step 6 only — a self-hosted Temporal server + Web UI (NOT needed for `mvn test`):
#   docker compose -f docker-compose.temporal.yml up -d
#   # server: localhost:7233, Web UI: http://localhost:8233
#   mvn -q compile exec:java -Dexec.mainClass=dev.vlearning.trips.temporal.TemporalSagaRunner
#   # and to run the (otherwise skipped) integration test:
#   TEMPORAL_ADDRESS=127.0.0.1:7233 mvn test -Dtest=TemporalTripSagaTest
services:
  temporal-postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal

  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      - temporal-postgresql
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.53.3
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8233:8080"
