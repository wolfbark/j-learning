spring.application.name=messaging-mechanics

# Wire format: String keys, JSON strings as values. Serialization is explicit on purpose —
# this lesson is about broker mechanics, so nothing about the wire should be magic.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

parcels.scan-partitions=3
parcels.topics.scans=parcels.scans
parcels.topics.tasks=parcels.notify-customer
parcels.topics.dlq=parcels.notify-customer.DLQ
parcels.feed-group=parcel-feed
parcels.notify-group=notify-workers

logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
