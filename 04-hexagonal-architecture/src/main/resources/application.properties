spring.application.name=hexagonal-quotes

# Round 1 fetches base rates from an "external" rate provider over HTTP.
# The stub provider lives inside this very app (see the ratestub package),
# so the default base URL points the app at itself.
rate-provider.base-url=http://localhost:8080

# Let Hibernate create the schema first, then run data.sql (seeds the products table).
spring.jpa.defer-datasource-initialization=true
