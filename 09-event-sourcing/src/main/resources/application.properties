spring.application.name=ledger

# --- The two switches this lesson flips ---------------------------------------------------
# Step 3: change to `postgres` once checkpoint 3 is green.
ledger.event-store=in-memory
# Step 5: change to `true` once checkpoint 5 is green.
ledger.snapshots.enabled=false
ledger.snapshots.every=10
# Step 4: set to `true` to watch the polling projector when running the app by hand.
# Kept off so checkpoint tests can drive runOnce() deterministically.
ledger.projections.polling=false
ledger.projections.poll-interval-ms=200

# Local run: `docker compose up -d postgres` first. Tests override this via Testcontainers.
spring.datasource.url=jdbc:postgresql://localhost:5432/ledger
spring.datasource.username=ledger
spring.datasource.password=ledger
