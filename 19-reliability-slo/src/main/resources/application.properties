spring.application.name=settlement-service

# ---------------------------------------------------------------------------
# STEP 1 PARTLY LIVES HERE. Boot can emit every log line as JSON with one
# property and no extra dependency:
#
#   logging.structured.format.console=ecs
#
# (ecs = Elastic Common Schema; logstash and gelf are also built in, and you can
# register your own StructuredLogFormatter.) Turn it on once you have moved the
# settlement audit line to key/value form, and look at what your logs became.
# ---------------------------------------------------------------------------
logging.pattern.level=%5p [${spring.application.name},%X{correlationId:-}]

# --- Metrics ---------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
# The DB health indicator would open a connection at /actuator/health time; the
# database only exists during step 6, so it stays off.
management.health.db.enabled=false

# STEP 3's registry-wide alternative, for reference. The checkpoint tests the
# code path (LatencyProfile) because that is where per-meter decisions belong,
# but in a real service you will meet both:
#
#   management.metrics.distribution.percentiles-histogram.settlement.latency=true
#   management.metrics.distribution.percentiles.settlement.latency=0.5,0.95,0.99
#   management.metrics.distribution.slo.settlement.latency=250ms
#
# STEP 2's safety net, also for reference. A MeterFilter is a backstop, not a
# fix: it drops series after the arithmetic has already gone wrong.
#
#   (see the lesson — MeterFilter.maximumAllowableTags(...))

# --- Step 6: the connection pool ------------------------------------------
# Only step 6 needs a database. Testcontainers supplies one to the checkpoint
# test; these defaults exist so the app can be run against a local Postgres.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Four connections, and the Hikari default of 30 seconds of patience. Both
# numbers are step 6's subject: the first decides your throughput ceiling, the
# second decides how long a caller waits before finding out.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=30000

# The other half of step 6. A connection timeout bounds how long you wait FOR a
# connection; it says nothing about how long a query may hold one. That is a
# statement timeout, and it is a different setting entirely:
#
#   spring.datasource.hikari.connection-init-sql=SET statement_timeout = '300ms'
#
# There is a JDBC-side equivalent, and it has a trap in it:
#
#   spring.jdbc.template.query-timeout=1s
#
# Statement.setQueryTimeout takes WHOLE SECONDS, and Boot truncates the Duration
# to seconds when it applies this property — so any value below one second
# becomes zero, which means "no timeout". Verified the hard way while writing
# this project. Sub-second bounds have to come from the server.
