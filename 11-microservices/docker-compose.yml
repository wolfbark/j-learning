# The whole system: one Kafka broker (KRaft, single node), one Postgres for
# the order-service, and the two services themselves.
#
#   mvn -q -f order-service/pom.xml package -DskipTests
#   mvn -q -f shipping-service/pom.xml package -DskipTests
#   docker compose up --build
#
# Step 4's manual exercise: `docker compose stop shipping-service`, place
# orders, `docker compose start shipping-service`, watch the catch-up.
services:

  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"   # host access: localhost:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  orders-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5433:5432"   # so a locally-run order-service finds it too
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 2s
      timeout: 2s
      retries: 15

  shipping-service:
    build: ./shipping-service
    ports:
      - "8081:8081"
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
    depends_on:
      kafka:
        condition: service_started

  order-service:
    build: ./order-service
    ports:
      - "8080:8080"
    environment:
      ORDERS_DB_URL: jdbc:postgresql://orders-db:5432/orders
      ORDERS_DB_USER: orders
      ORDERS_DB_PASSWORD: orders
      SHIPPING_BASE_URL: http://shipping-service:8081
      KAFKA_BOOTSTRAP: kafka:19092
    depends_on:
      orders-db:
        condition: service_healthy
      shipping-service:
        condition: service_started
      kafka:
        condition: service_started
