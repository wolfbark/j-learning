spring.application.name=checkout-service

# The payment gateway's address. Tests point this at WireMock; docker-compose
# points it at the bundled stub.
gateway.base-url=${GATEWAY_BASE_URL:http://localhost:9099}

# ---------------------------------------------------------------------------
# STEP 1 LIVES HERE. There are no HTTP client timeouts configured, which means
# the default is "wait forever". Boot 4 exposes them as plain properties that
# apply to every auto-configured RestClient:
#
#   spring.http.clients.connect-timeout=1s
#   spring.http.clients.read-timeout=1s
#
# Note the PLURAL "clients". Boot 4.1 also accepts spring.http.client.* and it
# silently does nothing to the auto-configured RestClient.Builder — a typo that
# costs an afternoon, and a good reason to assert timeouts in a test.
#
# Until you add them, one slow dependency can hold a request — and whatever
# resources it is holding — open indefinitely.
# ---------------------------------------------------------------------------

# ── Observability ──────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.tracing.sampling.probability=1.0
# Trace id in every log line, so logs and traces can be joined by eye.
logging.pattern.level=%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]
# Where the OTLP exporter ships spans. Harmless when nothing is listening;
# point it at the docker-compose LGTM stack for step 6.
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.metrics.export.enabled=false
