spring.application.name=banking-transactions

spring.sql.init.mode=always

# A connection is held for as long as a transaction is open, so pool size is
# really a cap on concurrent transactions. Step 8 shrinks this to 4 to make the
# consequence visible in seconds instead of at 3am.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=2000

# Uncomment to watch the boundaries: every statement, and every transaction the
# proxy opens and closes. Invaluable in steps 6 and 7, very noisy everywhere else.
#logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
#logging.level.org.springframework.transaction.interceptor=TRACE
