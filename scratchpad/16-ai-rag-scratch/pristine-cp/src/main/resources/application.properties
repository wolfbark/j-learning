spring.application.name=ai-rag

# Local Postgres for manual runs: docker compose up -d pgvector. Tests bring their own container.
spring.datasource.url=jdbc:postgresql://localhost:5432/rag
spring.datasource.username=rag
spring.datasource.password=rag

# We own the vector table's DDL (V1__vector_store.sql), so Spring AI must not create it.
# Boot 4 note: Flyway autoconfiguration comes from spring-boot-starter-flyway, not flyway-core.
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.dimensions=1024

# offline = the deterministic hashing embedder + extractive chat model, no key, no network.
# real    = whatever spring-ai-starter-model-* you add. See the OPTIONAL section of the README.
rag.models=offline

# The corpus is this repository. Yes, really.
rag.corpus-paths=file:../docs/research/*.md,file:../*/README.md
rag.top-k=4
rag.similarity-threshold=0.0
rag.max-chunk-chars=800
rag.overlap-tokens=40

logging.level.dev.vlearning.airag=INFO
